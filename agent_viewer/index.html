<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실장님 Shorts · Agent Viewer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111214;color:#f4f4f2;font:16px system-ui}header{padding:24px 5vw;border-bottom:1px solid #333;display:flex;justify-content:space-between}header span{color:#a0a1a4}main{max-width:1180px;margin:50px auto;padding:0 24px}h1{font-size:38px;letter-spacing:-1.5px}p{color:#b9bbbf;line-height:1.7}select{background:#222;color:white;padding:12px;border:1px solid #555;width:100%}.output{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}video,img{width:100%;max-height:68vh;object-fit:contain;background:#08090b}a{color:#ddd;margin-right:20px}#state{color:#ff674e}#frames{display:flex;gap:12px;overflow:auto;margin-top:30px}#frames img{width:150px}article{margin-bottom:30px}h2{font-size:18px}#empty{padding:80px 0;border-bottom:1px solid #333}@media(max-width:700px){.output{grid-template-columns:1fr}header span{display:none}}
</style><header><strong>실장님 Shorts</strong><span>AGENT VIEWER · 대화로 만들고, 여기서 확인하세요</span></header><main><select id="projects" aria-label="프로젝트"></select><h1 id="title">에이전트와 쇼츠를 만들어 보세요.</h1><p id="state">연결 대기</p><p id="brief"></p><div id="empty">대화에서 기획과 수정을 요청하면, 에이전트가 만든 썸네일과 영상이 이곳에 표시됩니다.</div><div class="output" id="output" hidden><article><h2>썸네일</h2><img id="cover" alt="에이전트가 제작한 쇼츠 썸네일"></article><article><h2>영상</h2><video id="film" controls playsinline preload="metadata"></video></article></div><nav id="downloads"></nav><div id="frames"></div><p id="review"></p></main>
<script>const $=id=>document.getElementById(id);let selected=new URLSearchParams(location.search).get('project'),key='';
async function refresh(){try{const projects=await(await fetch('/api/projects')).json();if(!selected&&projects.length)selected=projects.at(-1).id;$('projects').replaceChildren(...projects.map(p=>new Option(p.title,p.id,false,p.id===selected)));const p=projects.find(p=>p.id===selected);if(!p)return;$('title').textContent=p.title;$('brief').textContent=p.brief;$('state').textContent=`REVISION ${p.revision} · ${p.job.stage||'대화에서 작업을 시작하세요'} · ${p.job.status||'대기'}${p.job.error?' · '+p.job.error:''}`;const r=p.preview;if(!r){$('output').hidden=true;$('empty').hidden=false;$('frames').replaceChildren();$('downloads').replaceChildren();key='';return}const next=p.id+r.folder;$('empty').hidden=true;$('output').hidden=false;if(key!==next){key=next;const base='/media/'+p.id+'/'+r.folder+'/';$('cover').src=base+r.thumbnail;$('film').poster=base+r.thumbnail;if(r.preview){$('film').src=base+r.preview;$('film').hidden=false}else{$('film').removeAttribute('src');$('film').hidden=true}$('frames').replaceChildren(...r.frames.map(name=>{const img=document.createElement('img');img.src=base+'stills/'+name;img.alt=name;return img}));const files=[['썸네일 PNG',r.thumbnail],...(r.master?[['원본 MP4',r.master],['미리보기',r.preview],['한국어 자막','subtitles.ko.srt'],['영어 자막','subtitles.en.srt']]:[])];$('downloads').replaceChildren(...files.map(([text,name])=>{const a=document.createElement('a');a.textContent=text;a.href=base+name;a.download=name;return a}))}$('review').textContent=p.review?.notes||'에이전트가 대표 프레임을 확인하고 피드백을 반영합니다.'}catch(e){$('state').textContent='에이전트 연결을 기다립니다.'}}
$('projects').onchange=()=>{selected=$('projects').value;key='';refresh()};refresh();setInterval(refresh,2000);</script></html>
